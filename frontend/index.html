<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/embodied_waveform.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EmbodiedWaveform</title>
		<script>
			// Respect the saved choice before React loads; ThemeProvider owns later updates.
			let theme = 'system';
			try {
				theme = localStorage.getItem('theme') || 'system';
			} catch {
				// Storage can be unavailable; use the system preference for this visit.
			}
			const dark = theme === 'dark' ||
				(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
			document.documentElement.classList.toggle('dark', dark);
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
